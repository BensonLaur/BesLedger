  function parseSms(){
    const text=state.note;
    const amount=text.match(/(?:消费|支出|扣款|支付|收入)(?:人民币|金额|[：:\s])*([\d,]+\.\d{1,2})\s*元?/);
    if(!amount){state.recognized=false;return false;}
    state.amount=amount[1].replace(/,/g,'');
    state.entryType=/收入/.test(text)?'收入':'支出';
    state.category=state.entryType==='收入'?'工资薪水':/食堂|餐|饭/.test(text)?'午餐':/加油/.test(text)?'加油':/停车/.test(text)?'停车费':'待分类';
    state.account=/4321/.test(text)?'常用储蓄卡':'待选择账户';
    const date=text.match(/(\d{1,2})月(\d{1,2})日\s*(\d{2}:\d{2})/);
    if(date)state.date=`2026-${date[1].padStart(2,'0')}-${date[2].padStart(2,'0')}T${date[3]}`;
    state.recognized=true;return true;
  }

      const n=root.querySelector('#bl-cat-name').value.trim(),type=state.entryType==='收入'?'收入':'支出',p=root.querySelector('#bl-cat-parent')?.value;
      if(!n){toast('请填写类别名称');return;}if(categoryNames(type).includes(n)){toast('该类别已存在');return;}
      if(type==='收入')incomeCategories.push(n);else if(Object.hasOwn(categories,p))categories[p].push(n);else return;
      state.categoryGroup=type==='收入'?'收入':p;state.categoryQuery='';render();toast('类别已添加，记账使用后会进入常用候选');return;
    }
    if(action==='new-book'){showSheet('新建账本',`<input id="bl-book-name" aria-label="账本名称" placeholder="账本名称"><div class="bl-form-row"><span>保存方式</span><select aria-label="账本保存方式"><option>仅保存在本机</option><option>开启 GitHub 同步</option></select></div><p class="bl-note">资金账户可与已有账本共用。</p><div class="bl-actions">${primary('创建账本','create-book')}</div>`);return;}
    if(action==='create-book'){const name=root.querySelector('#bl-book-name').value.trim();if(!name){toast('请填写账本名称');return;}state.book=name;go('home');toast('已切换到示例新账本');return;}

    if(action==='sync-settings'){syncPanel();return;}
    if(action==='preview-ready'){state.previewConnection='ready';syncPanel();return;}
    if(action==='preview-login'){state.previewConnection='waiting';syncPanel();return;}
    if(action==='preview-authorize'){state.previewConnection='preparing';syncPanel();return;}
    if(action==='preview-logout'){state.previewConnection='local';syncPanel();return;}
    if(action==='preview-lock'){state.previewLocked=true;welcomePreview();return;}
    if(action==='preview-create'){welcomePreview(false);return;}
    if(action==='preview-created'){const password=root.querySelector('#bl-welcome-password').value,error=root.querySelector('#bl-welcome-error');if(password.length<10||password!==root.querySelector('#bl-welcome-confirm').value){error.textContent='请设置至少 10 个字符的密码，并确保两次输入一致。';error.hidden=false;return;}showSheet('保存恢复密钥（模拟）',`<p class="bl-note">忘记解锁密码时，用它找回账本。请存入密码管理器，或抄写后妥善保管，不要只留在应用里。</p><code>DEMO · 非真实恢复密钥</code>${button('复制恢复密钥（模拟）','preview-copy-key','','bl-secondary')}<p id="bl-demo-copy-result" class="bl-note" role="status"></p><label><input id="bl-demo-key-saved" type="checkbox">我已独立保存恢复密钥（模拟）</label>${button('进入账本（模拟）','preview-unlock','id="bl-demo-enter" disabled','bl-primary')}`);return;}
    if(action==='preview-copy-key'){root.querySelector('#bl-demo-copy-result').textContent='已模拟复制。正式应用中请粘贴到安全位置并确认保存；复制不代表已保存。';return;}
    if(action==='preview-update-ready'){state.previewUpdateReady=true;welcomePreview(state.previewWelcomeExisting);return;}
    if(action==='preview-update'){if(root.querySelector('#bl-welcome-password')?.value||root.querySelector('#bl-welcome-confirm')?.value||(root.querySelector('#bl-welcome-book')&&root.querySelector('#bl-welcome-book').value!=='日常生活')){toast('请先完成当前输入，或返回并清空后更新');return;}state.previewUpdateReady=false;welcomePreview(state.previewWelcomeExisting);toast('已模拟更新，示例账目保留');return;}
    if(action==='preview-password-visibility'){const input=root.querySelector('#bl-welcome-password'),show=input.type==='password';input.type=show?'text':'password';el.setAttribute('aria-label',show?'隐藏解锁密码':'显示解锁密码');el.setAttribute('aria-pressed',String(show));el.innerHTML=icon(show?'eye-off':'eye');refreshIcons();return;}
    if(action==='preview-previous'){showSheet('从本地备用副本恢复（模拟）',`<p class="bl-note">这份副本保存的是最近一次本地保存之前的内容。恢复会替换当前全部本地账本，近期修改可能不在其中。</p><div class="bl-card"><strong>可读取的备用副本</strong><p>1 本账本、2 个账户、3 笔账目 · 虚构数据</p></div><label><input id="bl-previous-consent" type="checkbox">我确认使用这份本地备用副本恢复</label><div class="bl-actions">${button('返回解锁','preview-lock')}${button('确认使用备用副本（模拟）','preview-previous-confirm','','bl-primary')}</div>`);return;}
    if(action==='preview-previous-confirm'){if(!root.querySelector('#bl-previous-consent').checked){toast('请先核对备用副本并确认恢复');return;}state.previewLocked=false;state.previewDamage='normal';render();toast('已模拟恢复，不改动真实账目');return;}
    if(action==='preview-unlock'){const input=root.querySelector('#bl-welcome-password');if(input){const error=root.querySelector('#bl-welcome-error'),repair=root.querySelector('#bl-repair-available');repair.hidden=true;if(input.value!=='DEMO'){error.textContent='未能打开账本，请检查解锁密码后重试。示例密码为 DEMO。';error.hidden=false;input.type='password';input.focus();input.select();return;}if(state.previewDamage&&state.previewDamage!=='normal'){error.textContent='当前账目读取异常（模拟），原数据未改动。';error.hidden=false;repair.hidden=state.previewDamage!=='repairable';return;}}state.previewLocked=false;render();return;}
    if(action==='preview-reset-password'){showSheet('重设解锁密码（模拟）',`<p class="bl-note">设置新密码，原有账本和账目保留。仅为原型演示，恢复密钥请填 DEMO，不要填写真实密钥或密码。</p><div class="bl-field"><label for="bl-reset-key">恢复密钥</label><input id="bl-reset-key" type="password" autocomplete="off" placeholder="DEMO"></div><details><summary class="bl-note">恢复密钥在哪里？</summary><p class="bl-note">创建账本时曾显示一串恢复密钥，请查找密码管理器、纸张或其他安全位置的记录。其他设备新建的密钥不能通用。</p></details><div class="bl-field"><label for="bl-reset-password">新的解锁密码</label><input id="bl-reset-password" type="password" autocomplete="off" placeholder="至少 10 个字符"></div><div class="bl-field"><label for="bl-reset-confirm">再次输入新密码</label><input id="bl-reset-confirm" type="password" autocomplete="off"></div><p id="bl-reset-error" class="bl-error" role="alert" hidden></p><div class="bl-actions">${button('重设密码并打开（模拟）','preview-reset-confirm','','bl-primary')}${button('返回解锁','preview-lock','','bl-secondary')}</div><details><summary class="bl-note">没保存恢复密钥怎么办？</summary><p class="bl-note">如有加密备份且记得导出时的密码，可找回备份中的账目。请先保留现有数据。</p>${button('用备份找回账本','preview-backup')}</details>`);return;}
    if(action==='preview-reset-confirm'){
      const error=root.querySelector('#bl-reset-error'),password=root.querySelector('#bl-reset-password').value;
      const fail=message=>{error.textContent=message;error.hidden=false;};
      if(root.querySelector('#bl-reset-key').value!=='DEMO'){fail('模拟密钥不正确，示例账目保留');return;}
      if(password.length<10){fail('请填写至少 10 个字符的新密码');return;}
      if(password!==root.querySelector('#bl-reset-confirm').value){fail('两次新密码不一致');return;}
      state.previewLocked=false;render();toast('已模拟重设密码，示例账目保留');return;
    }
    if(action==='preview-backup'){backupPreview();return;}
    if(action==='preview-backup-check'){const error=root.querySelector('#bl-demo-backup-error');if(root.querySelector('#bl-demo-backup-password').value!=='DEMO'){error.textContent='未能解密备份，请核对备份原密码。示例账目未改动。';error.hidden=false;return;}showSheet('确认恢复备份（模拟）',`<div class="bl-card"><strong>备份已校验</strong><p>1 本账本、2 个账户、3 笔账目 · 虚构数据</p></div><p class="bl-note">恢复会替换当前全部本地账本，未备份的新账目不会出现在恢复后的账本中。</p><label for="bl-demo-new-password">新的解锁密码</label><input id="bl-demo-new-password" type="password" autocomplete="off"><label for="bl-demo-new-confirm">再次输入新密码</label><input id="bl-demo-new-confirm" type="password" autocomplete="off"><label><input id="bl-demo-replace" type="checkbox">我确认用这份备份替换当前全部本地账本</label><p id="bl-demo-restore-error" class="bl-error" role="alert" hidden></p><div class="bl-actions">${primary('确认恢复备份（模拟）','preview-backup-confirm')}${button('返回解锁','preview-lock')}</div>`);return;}
    if(action==='preview-backup-confirm'){const password=root.querySelector('#bl-demo-new-password').value,error=root.querySelector('#bl-demo-restore-error');if(password.length<10||password!==root.querySelector('#bl-demo-new-confirm').value||!root.querySelector('#bl-demo-replace').checked){error.textContent='请确认新密码至少 10 个字符、两次输入一致，并确认替换账本。';error.hidden=false;return;}state.previewLocked=false;render();toast('已模拟恢复虚构备份，不改动真实账目');return;}
    if(action==='preview-local-key'){showSheet('本机恢复密钥',`<p class="bl-note">界面原型不生成真实密钥。这是当前本地空间的恢复密钥，不一定能解密其他设备的账本，请独立保存。</p>${button('我已了解','close-sheet','','bl-primary')}`);return;}
    if(action==='preview-key'){showSheet('此设备的同步密钥',`<p class="bl-note">同步密钥已在此设备加密保存（模拟）。忘记不删除账目或云端数据；换设备仍需原设备密钥。</p>${button('忘记此设备密钥（模拟）','preview-forget','','bl-secondary')}`);return;}
    if(action==='preview-forget'){state.previewKeySaved=false;render();toast('已模拟忘记密钥，账目保留');return;}
    if(action==='preview-upload'){if(['offline','error','preparing'].includes(state.previewConnection)){toast('当前尚不能同步，本地账目保留');return;}state.previewUploaded=true;state.previewKeySaved=true;render();toast('模拟同步完成，不上传真实数据');return;}
    if(action==='preview-download'){if(['offline','error','preparing'].includes(state.previewConnection)){toast('当前尚不能下载，本地账目保留');return;}if(state.previewKeySaved){toast('已模拟使用设备保存的密钥同步');return;}showSheet('首次下载（模拟）',`<p class="bl-note">输入原设备的同步恢复密钥。此处仅演示，请填 DEMO，不要输入真实密钥。</p><input id="bl-demo-key" aria-label="模拟同步密钥" placeholder="DEMO"><p id="bl-demo-key-error" class="bl-error" hidden>模拟密钥不正确，原账目和已保存密钥未改变。</p>${button('解密并下载（模拟）','preview-download-confirm','','bl-primary')}`);return;}
    if(action==='preview-download-confirm'){if(root.querySelector('#bl-demo-key').value!=='DEMO'){root.querySelector('#bl-demo-key-error').hidden=false;return;}state.previewKeySaved=true;state.previewDownloaded=true;render();return;}
    if(action==='preview-resolve'){state.previewConnection='ready';state.previewUploaded=false;render();toast('已模拟选择版本，请再次同步');return;}
    if(action==='preview-help'){showSheet('记账、登录与同步',`<p class="bl-note">资金账户是现金、银行卡等，账本用来整理账目，GitHub 账号只提供可选同步。登录不会上传、覆盖或合并账本；同名不同账本独立存在。</p><p class="bl-note">锁定本地空间、退出 GitHub、忘记某本账的同步密钥是不同操作。修改后点击“同步”，另一设备再同步取回更新。</p>`);return;}
    if(action==='preview-recycle'){showSheet('回收站（模拟）','<p class="bl-note">当前没有已删除的示例账目。</p>');return;}
    if(action==='backup'||action==='backup-demo'||action==='restore-demo'){showSheet('备份与恢复（模拟）','<p class="bl-note">正式应用先校验备份并预览内容，经确认后才恢复。此原型不读取或生成真实备份，请独立保存备份和恢复密钥。</p>');return;}
    if(action==='edit-original'){state.entryType='支出';state.category='运动健身';state.amount='1000';state.note='运动课程 · 调整套餐';go('entry');return;}
    if(action==='saved-detail'){toast('这是一条保存在当前预览中的示例记录');return;}
  });
  render();
  window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.modelContent;if(!s||s.revision&&s.revision!=='home-budget-watermark')return;if(s.homeState)ledgerHome.restore(s.homeState);if(pages[s.page])state.page=s.page;if(['mobile','tablet','desktop'].includes(s.device))state.device=s.device;if(['auto','light','dark'].includes(s.appearance))state.appearance=s.appearance;if(['ink','forest','amber'].includes(s.palette))state.palette=s.palette;if(['收入','支出','转账','借贷'].includes(s.entryType))state.entryType=s.entryType;if(transferKinds[s.transferKind])state.transferKind=s.transferKind;render();});
  if(globalThis.Tweak){
    const tweak=new globalThis.Tweak({container:root,onChange:()=>{state.modal='';render();keepState();}});
    tweak.addSelect(state,'device',{label:'设备布局',options:[{label:'手机',value:'mobile'},{label:'iPad',value:'tablet'},{label:'电脑',value:'desktop'}]});
    tweak.addSelect(state,'page',{label:'预览页面',options:Object.entries(pages).filter(([p])=>!['account','accountForm','refund','features'].includes(p)).map(([value,label])=>({label,value}))});
    tweak.addSelect(state,'palette',{label:'产品配色',options:[{label:'墨蓝 · 暖灰白',value:'ink'},{label:'森林绿 · 暖白',value:'forest'},{label:'暖琥珀 · 米白',value:'amber'}]});
    tweak.addSelect(state,'previewConnection',{label:'模拟连接状态',options:Object.entries(connectionStates).map(([value,label])=>({value,label}))});
    tweak.addSelect(state,'appearance',{label:'外观',options:[{label:'跟随应用',value:'auto'},{label:'浅色',value:'light'},{label:'深色',value:'dark'}]});
  }
})();
</script>
