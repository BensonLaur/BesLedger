name: 发布 Web/PWA
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 验证公开授权服务与浏览器跨域
        run: node scripts/check-auth-service.mjs
        env:
          BESLEDGER_AUTH_SERVICE: ${{ vars.BESLEDGER_AUTH_SERVICE }}
          BESLEDGER_GITHUB_APP_ID: ${{ vars.BESLEDGER_GITHUB_APP_ID }}
          BESLEDGER_GITHUB_APP_CLIENT_ID: ${{ vars.BESLEDGER_GITHUB_APP_CLIENT_ID }}
          BESLEDGER_GITHUB_APP_SLUG: ${{ vars.BESLEDGER_GITHUB_APP_SLUG }}
      - run: npm run build
        env:
          VITE_AUTH_SERVICE: ${{ vars.BESLEDGER_AUTH_SERVICE }}
          VITE_GITHUB_APP_ID: ${{ vars.BESLEDGER_GITHUB_APP_ID }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.BESLEDGER_GITHUB_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.BESLEDGER_GITHUB_APP_SLUG }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: 等待 Pages 产物就绪
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
          PAGES_RUN: ${{ github.run_id }}
        run: |
          # 上传完成后元数据可能短暂不可见；按运行次数隔离，重跑不选中旧产物。
          for attempt in {1..15}; do
            count=$(gh api --method GET "repos/$GH_REPO/actions/runs/$PAGES_RUN/artifacts" -f "name=$PAGES_ARTIFACT" --jq '.total_count')
            if [ "$count" = "1" ]; then
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::本次 Pages 产物不唯一"
              exit 1
            fi
            sleep 2
          done
          echo "::error::等待 Pages 产物元数据超时"
          exit 1
      - name: 发布 Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
