name: 构建签名 Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
        env:
          VITE_AUTH_SERVICE: ${{ vars.BESLEDGER_AUTH_SERVICE }}
          VITE_GITHUB_APP_ID: ${{ vars.BESLEDGER_GITHUB_APP_ID }}
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.BESLEDGER_GITHUB_APP_CLIENT_ID }}
          VITE_GITHUB_APP_SLUG: ${{ vars.BESLEDGER_GITHUB_APP_SLUG }}
      - name: 构建与校验长期签名 APK
        env:
          BESLEDGER_KEYSTORE_BASE64: ${{ secrets.BESLEDGER_KEYSTORE_BASE64 }}
          BESLEDGER_STORE_PASSWORD: ${{ secrets.BESLEDGER_STORE_PASSWORD }}
          BESLEDGER_KEY_PASSWORD: ${{ secrets.BESLEDGER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export BESLEDGER_KEYSTORE="$RUNNER_TEMP/besledger-release.jks"
          trap 'rm -f "$BESLEDGER_KEYSTORE"' EXIT
          printf '%s' "$BESLEDGER_KEYSTORE_BASE64" | base64 --decode > "$BESLEDGER_KEYSTORE"
          chmod 600 "$BESLEDGER_KEYSTORE"
          bash android/gradlew -p android --no-daemon assembleRelease
          mkdir -p artifacts
          version=$(node -p "require('./package.json').version")
          release_apk="artifacts/BesLedger-${version}-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$release_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$release_apk" > artifacts/signature.txt
          sha256sum "$release_apk" > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: besledger-signed-release
          path: artifacts
