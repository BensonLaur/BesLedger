name: 验证 Web 与 Android
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_AUTH_SERVICE: ${{ vars.BESLEDGER_AUTH_SERVICE }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: besledger-web
          path: dist
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run android:sync
        env:
          VITE_AUTH_SERVICE: ${{ vars.BESLEDGER_AUTH_SERVICE }}
      - run: bash android/gradlew -p android --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: besledger-android-debug-verification-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
